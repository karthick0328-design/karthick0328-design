<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05080c" />
    </radialGradient>
    
    <!-- Accent & Text Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Patterns -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="30" cy="30" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="320" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="80" r="140" fill="#00f2fe" opacity="0.08" filter="url(#cyanGlow)" />
  <circle cx="780" cy="240" r="160" fill="#8b5cf6" opacity="0.09" filter="url(#cyanGlow)" />
  <circle cx="450" cy="160" r="100" fill="#3b82f6" opacity="0.05" filter="url(#cyanGlow)" />

  <!-- Main Card Container (Glassmorphism Effect) -->
  <rect x="25" y="25" width="850" height="270" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Window Control Dots -->
  <circle cx="55" cy="52" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="73" cy="52" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="91" cy="52" r="5.5" fill="#10b981" opacity="0.85" />
  <text x="115" y="56" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">karthick0328-design // profile-overview</text>

  <!-- Divider Line in Card Header -->
  <line x1="25" y1="72" x2="875" y2="72" stroke="#374151" stroke-width="1" opacity="0.5" />

  <!-- Main Content Layout -->
  <!-- Left Side: Typography & Intro -->
  <g transform="translate(55, 100)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="13" r="4" fill="#10b981" filter="url(#subtleGlow)" />
    <text x="26" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN FOR OPPORTUNITIES</text>

    <!-- Main Title (Name) -->
    <text x="0" y="62" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Karthick Pandi</text>
    
    <!-- Subtitle / Role -->
    <text x="0" y="90" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.2">Full Stack Developer <tspan fill="#38bdf8">•</tspan> 3D &amp; AI Web Developer</text>
    
    <!-- Tagline -->
    <text x="0" y="116" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">Architecting high-performance web platforms, 3D visualizations, &amp; intelligent tools.</text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 134)">
      <!-- React -->
      <rect x="0" y="0" width="62" height="22" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="31" y="15" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">React</text>

      <!-- Node.js -->
      <rect x="70" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#4ade80" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="105" y="15" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Node.js</text>

      <!-- TypeScript -->
      <rect x="148" y="0" width="86" height="22" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="191" y="15" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

      <!-- Python -->
      <rect x="242" y="0" width="66" height="22" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="275" y="15" fill="#facc15" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>

      <!-- Three.js -->
      <rect x="316" y="0" width="76" height="22" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.4" />
      <text x="354" y="15" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Three.js</text>
    </g>
  </g>

  <!-- Right Side: Decorative Interactive-looking Code Snippet Card -->
  <g transform="translate(525, 96)">
    <rect width="325" height="175" rx="10" fill="#0b0f17" stroke="#1f2937" stroke-width="1.2" />
    <rect width="325" height="28" rx="10" fill="#161b22" />
    <rect y="20" width="325" height="8" fill="#161b22" />
    <text x="15" y="18" fill="#9ca3af" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="11">developer.config.ts</text>
    <circle cx="305" cy="14" r="3" fill="#38bdf8" />

    <!-- Code Block lines -->
    <g transform="translate(15, 45)" font-family="Consolas, Monaco, 'Fira Code', monospace" font-size="11.5">
      <text x="0" y="0" fill="#c084fc">const</text>
      <text x="42" y="0" fill="#38bdf8">developer</text>
      <text x="114" y="0" fill="#e5e7eb">=</text>
      <text x="126" y="0" fill="#e5e7eb">{</text>

      <text x="14" y="20" fill="#9ca3af">name:</text>
      <text x="60" y="20" fill="#4ade80">"Karthick Pandi"</text><text x="175" y="20" fill="#e5e7eb">,</text>

      <text x="14" y="38" fill="#9ca3af">degree:</text>
      <text x="74" y="38" fill="#4ade80">"MCA (2025)"</text><text x="160" y="38" fill="#e5e7eb">,</text>

      <text x="14" y="56" fill="#9ca3af">location:</text>
      <text x="88" y="56" fill="#4ade80">"Madurai, IN"</text><text x="180" y="56" fill="#e5e7eb">,</text>

      <text x="14" y="74" fill="#9ca3af">passion:</text>
      <text x="80" y="74" fill="#facc15">["FullStack", "3D", "AI"]</text><text x="236" y="74" fill="#e5e7eb">,</text>

      <text x="14" y="92" fill="#9ca3af">status:</text>
      <text x="70" y="92" fill="#38bdf8">"Ready to Innovate 🚀"</text>

      <text x="0" y="112" fill="#e5e7eb">};</text>
    </g>
  </g>

  <!-- Bottom Decorative Border Glow Line -->
  <line x1="25" y1="294" x2="875" y2="294" stroke="url(#primaryGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
