<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 185" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3178c6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Card Frame -->
  <rect width="340" height="185" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Header Title -->
  <text x="20" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Most Used Languages</text>

  <!-- Progress Bar Base -->
  <g transform="translate(20, 48)">
    <!-- TypeScript -->
    <text x="0" y="14" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">TypeScript</text>
    <text x="290" y="14" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="end">42%</text>
    <rect x="0" y="22" width="290" height="7" rx="3.5" fill="#21262d" />
    <rect x="0" y="22" width="122" height="7" rx="3.5" fill="url(#tsGrad)" />

    <!-- JavaScript -->
    <text x="0" y="48" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">JavaScript</text>
    <text x="290" y="48" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="end">32%</text>
    <rect x="0" y="56" width="290" height="7" rx="3.5" fill="#21262d" />
    <rect x="0" y="56" width="93" height="7" rx="3.5" fill="url(#jsGrad)" />

    <!-- HTML / CSS -->
    <text x="0" y="82" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">HTML &amp; CSS</text>
    <text x="290" y="82" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="end">16%</text>
    <rect x="0" y="90" width="290" height="7" rx="3.5" fill="#21262d" />
    <rect x="0" y="90" width="46" height="7" rx="3.5" fill="url(#htmlGrad)" />

    <!-- Python -->
    <text x="0" y="116" fill="#e5e7eb" font-family="sans-serif" font-size="12" font-weight="600">Python</text>
    <text x="290" y="116" fill="#9ca3af" font-family="sans-serif" font-size="11" text-anchor="end">10%</text>
    <rect x="0" y="124" width="290" height="7" rx="3.5" fill="#21262d" />
    <rect x="0" y="124" width="29" height="7" rx="3.5" fill="url(#pyGrad)" />
  </g>
</svg>
